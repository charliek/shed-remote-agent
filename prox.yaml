# Local dev topology for shed-remote-agent.
#
# Supervises this project's own services only: the api + web dev servers.
#
# Credential brokering (ssh-agent / docker / aws) is NO LONGER run from here.
# Each shed host runs its own shed-host-agent, installed and managed by Homebrew
# (`brew install charliek/tap/shed-host-agent`; `brew services start
# shed-host-agent`), scoped to that host's local shed-server only — this Mac's
# agent brokers just its localhost server; mini2/mini3 each broker their own.
# The shed CLI (and this app, via ~/.shed/config.yaml) still reach every server
# regardless of host-agent scope, so the orchestrator needs no agent of its own.
#
# HTTPS routing for the app is handled by devproxy (see devproxy.yaml); prox
# here is only a process supervisor.

processes:
  api: bun run dev:api
  web: bun run dev:web
