# Local dev topology for shed-remote-agent.
#
# Covers two things in one place:
#   1. This project's own services (api + web).
#   2. One shed-host-agent process per shed host we want to broker credentials
#      for (mini2, mini3). Each agent subscribes to a single shed-server over
#      tailscale and answers ssh-agent / docker-credentials extension requests
#      using the local user's keys (~/.ssh, ~/.docker/config.json).
#
# Prereqs (per machine):
#   - `shed-host-agent` on $PATH — install from
#     https://github.com/charliek/shed-extensions/releases or symlink a dev
#     build (`make build-host` in shed-extensions, then ln -sf into ~/.local/bin).
#
# Add more hosts by:
#   1. Writing host-agents/extensions.<host>.yaml in this repo
#   2. Adding a shed-host-agent-<host> entry below
#
# HTTPS routing for the app is still handled by devproxy (see devproxy.yaml);
# prox here is only a process supervisor.

processes:
  api: bun run dev:api
  web: bun run dev:web

  shed-host-agent-mini2:
    cmd: shed-host-agent -config host-agents/extensions.mini2.yaml

  shed-host-agent-mini3:
    cmd: shed-host-agent -config host-agents/extensions.mini3.yaml
