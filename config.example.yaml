# Example config for shed-remote-agent.
# Copy this to ~/.config/shed-remote-agent/config.yaml and edit.

defaults:
  # SSH user + absolute path on shed *hosts* where projects live. The backend
  # runs `ls` under this user to populate the local-dir picker.
  local_dir:
    user: charliek
    path: /home/charliek/projects

github:
  # Owners for the repo picker. Resolved via `gh repo list <owner>` on the
  # machine the backend runs on, so that machine needs `gh auth login`.
  owners:
    - charliek

# Optional per-host overrides keyed by the shed-host name from ~/.shed/config.yaml
# hosts:
#   macbook:
#     local_dir:
#       user: charliek
#       path: /Users/charliek/projects

# Native machines (non-shed) reachable via SSH that you also want to
# bootstrap `claude remote-control` sessions on. Same RC UX as sheds, but
# the SSH target is a regular user@host instead of <shedname>@shed-host.
# Each machine needs `tmux` and (for repl/agent kinds) `claude` installed.
# machines:
#   - name: pop-os
#     host: pop-os               # tailnet hostname or IP
#     user: charliek
#     ssh_port: 22               # optional, default 22
#     workdir: /home/charliek/projects   # default cwd for new RC sessions; default ~
