# Example config for shed-remote-agent.
# Copy this to ~/.config/shed-remote-agent/config.yaml and edit.

defaults:
  # SSH user + absolute path on shed *hosts* where projects live. The backend
  # runs `ls` under this user to populate the local-dir picker.
  local_dir:
    user: charliek
    path: /home/charliek/projects

github:
  # Owners for the repo picker. Resolved via `gh repo list <owner>` on the
  # machine the backend runs on, so that machine needs `gh auth login`.
  owners:
    - charliek

# Optional per-host overrides keyed by the shed-host name from ~/.shed/config.yaml
# hosts:
#   macbook:
#     local_dir:
#       user: charliek
#       path: /Users/charliek/projects

# Native machines (non-shed) you also want to bootstrap `claude remote-control`
# sessions on. Same RC UX as sheds. Two flavors:
#
#   - type: ssh    (default) — connects over SSH (e.g. Tailscale SSH to a
#                  tailnet host). Each machine needs `tmux`, `claude`, and the
#                  `shed-machine-rc` host CLI installed
#                  (`brew install charliek/tap/shed-machine-rc`, or
#                  `apt install shed-machine-rc`).
#   - type: local  — runs commands directly on the host this orchestrator
#                  is running on, with no SSH hop. Useful when Tailscale
#                  SSH can't loop back to the local node and you don't
#                  want to expose a local sshd.
#
# machines:
#   - name: pop-os
#     # type: ssh                # default, can be omitted
#     host: pop-os               # tailnet hostname or IP
#     user: charliek
#     ssh_port: 22               # optional, default 22
#     workdir: /home/charliek/projects   # default cwd for new RC sessions; default ~
#     # rc_bin: /opt/homebrew/bin/shed-machine-rc  # only if shed-machine-rc isn't on
#     #                                            # the machine's non-login SSH PATH
#
#   - name: mac-mini
#     type: local
#     user: charliek             # optional, display-only
#     workdir: /Users/charliek/projects
