# =============================================================================
# Documentation Style Guidelines
# =============================================================================
# - Professional, direct tone (no marketing language)
# - Tables for all endpoints and configuration fields
# - Code blocks with language hints (yaml, bash, json, ts)
# - Use admonitions sparingly (only for important notes/warnings)
# - Examples should be copy-pasteable
# - Keep pages focused and concise - one topic per page
# =============================================================================

[project]

site_name = "shed-remote-agent"
site_description = "Mobile-first web UI for bootstrapping claude remote-control sessions inside sheds"
site_author = "shed-remote-agent Contributors"
site_url = "https://charliek.github.io/shed-remote-agent/"

repo_name = "charliek/shed-remote-agent"
repo_url = "https://github.com/charliek/shed-remote-agent"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site-build"

dev_addr = "127.0.0.1:7070"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Configuration" = "getting-started/configuration.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
  ] },
  { "Reference" = [
    { "HTTP API" = "reference/http-api.md" },
    { "Remote Control" = "reference/remote-control.md" },
    { "RC Session Convention" = "reference/rc-session-convention.md" },
    { "Secure Sheds (TLS + auth)" = "reference/secure-sheds.md" },
    { "Config Schema" = "reference/config-schema.md" },
  ] },
  { "Development" = [
    { "Setup" = "development/setup.md" },
    { "Architecture" = "development/architecture.md" },
    { "Testing" = "development/testing.md" },
  ] },
  { "Roadmap" = "ROADMAP.md" },
]

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
# The shared StrideLabs theme (stridelabs-docs-theme, pinned in pyproject.toml)
# supplies the palette, the self-hosted type stack, the feature toggles, and
# the owl + project-icon header lockup. Anything set here overrides it.
#
# Do NOT add a [project.theme.font] table: the theme sets `font: false` and
# ships its own woff2 faces, so setting one re-enables Zensical's Google Fonts
# <link> on every page while the self-hosted faces keep loading anyway.
[project.theme]
name = "stridelabs"

# The icon that says *which* tool this is -- rendered beside the shared owl.
[project.theme.icon]
logo = "material/remote-desktop"

# -----------------------------------------------------------------------------
# Extra
# -----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/charliek/shed-remote-agent"

# -----------------------------------------------------------------------------
# Markdown extensions
# -----------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# NOTE: the callable namespace is "zensical.extensions.emoji", not
# "material.extensions.emoji" - the latter aborts the build under Zensical.
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.toc]
permalink = true
